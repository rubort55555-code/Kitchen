# Приложение для Android: GitHub сам собирает файл APK при каждом изменении кода
# и выкладывает его на страницу Releases → «Кухня для Android (тестовая сборка)».
# Скачайте kitchen.apk на телефон и откройте — новая версия ставится поверх старой, данные сохраняются.
name: Android

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run android
      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk kitchen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-apk
          path: kitchen.apk
      - name: Выложить на страницу Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Кухня для Android (тестовая сборка)
          prerelease: true
          make_latest: false
          body: |
            Сборка №${{ github.run_number }} от ${{ github.sha }}.
            Как поставить: скачайте kitchen.apk на телефон, откройте его и разрешите установку из этого источника.
            Новая версия ставится поверх старой — данные сохраняются.
          files: kitchen.apk
