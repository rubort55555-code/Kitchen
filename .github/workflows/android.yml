# Приложение для Android: GitHub сам собирает APK после «Проверки» и выкладывает его на страницу Releases.
#  • из main — «Кухня для Android» (kitchen.apk): рабочая версия, ставится поверх прежней, данные сохраняются;
#  • из рабочих веток — «Кухня ТЕСТ для Android» (kitchen-test.apk): отдельное приложение «Кухня ТЕСТ»,
#    ставится РЯДОМ с рабочим, со своими данными, рецепты берёт с тестовой копии сайта.
name: Android

on:
  push:
    branches: [main, test, "claude/**"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Какую сборку: test — «Кухня ТЕСТ», prod — рабочая"
        type: choice
        options: [test, prod]
        default: test

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  apk:
    needs: checks
    runs-on: ubuntu-latest
    env:
      # main — рабочая версия, всё остальное — тестовая копия (вручную — как выбрано)
      KITCHEN_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || (github.ref_name == 'main' && 'prod' || 'test') }}
      KITCHEN_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Куда выкладывать
        run: |
          if [ "$KITCHEN_CHANNEL" = test ]; then
            { echo "TAG=android-test"; echo "TITLE=Кухня ТЕСТ для Android"; echo "APK=kitchen-test.apk"; } >> "$GITHUB_ENV"
          else
            { echo "TAG=android"; echo "TITLE=Кухня для Android"; echo "APK=kitchen.apk"; } >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run android
        env:
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
      - name: Выложить на страницу Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          prerelease: true
          make_latest: false
          body: |
            Сборка №${{ github.run_number }} из ветки ${{ github.ref_name }} (${{ github.sha }}).
            Как поставить: скачайте ${{ env.APK }} на телефон, откройте его и разрешите установку из этого источника.
            ${{ env.KITCHEN_CHANNEL == 'test' && 'Это тестовая копия «Кухня ТЕСТ»: ставится рядом с рабочим приложением, данные у неё свои. Для проверки на своих данных: в рабочем приложении Ещё → Данные → сохранить копию, в «Кухня ТЕСТ» — загрузить её.' || 'Новая версия ставится поверх старой — данные сохраняются.' }}
          files: ${{ env.APK }}
